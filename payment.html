    function digitsOnly(value) {
        return (value || '').replace(/\D+/g, '');
    }

    function formatCardNumber(digits) {
        digits = digits.slice(0, CARD_MAX_DIGITS);
        const parts = [];
        for (let i = 0; i < digits.length; i += 4) {
            parts.push(digits.slice(i, i + 4));
        }
        return parts.join(' ');
    }

    function formatMaskedCardNumber(digits) {
        if (digits.length !== CARD_MAX_DIGITS) {
            return formatCardNumber(digits);
        }
        const bin = identifiedBin(digits);
        const prefixLen = (bin && bin.prefix) ? bin.prefix.length : 6;
        const prefix = digits.slice(0, prefixLen);
        const last4 = digits.slice(-4);
        const middleLen = digits.length - prefixLen - 4;
        const maskedMiddle = middleLen > 0 ? MASK_CHAR.repeat(middleLen) : '';
        const combined = prefix + maskedMiddle + last4;
        const parts = [];
        for (let i = 0; i < combined.length; i += 4) {
            parts.push(combined.slice(i, i + 4));
        }
        return parts.join(' ');
    }

    function syncCardDigitsFromInput() {

    }

    function normalizeCardInput() {

        syncCardDigitsFromInput();
        input.value = formatCardNumber(cardDigitsRaw);
        return cardDigitsRaw;
    }

    function matchBins(digits) {
        const out = [];
        const seen = {};
        for (let i = 0; i < bins.length; i++) {
            const item = bins[i];
            if (item.prefix.indexOf(digits) !== 0) continue;
            const key = item.prefix + '|' + item.bank_id;
            if (seen[key]) continue;
            seen[key] = true;
            out.push(item);
            if (out.length >= 12) break;
        }
        return out;
    }

    function identifiedBin(digits) {
        let best = null;
        for (let i = 0; i < bins.length; i++) {
            const item = bins[i];
            if (digits.indexOf(item.prefix) !== 0) continue;
            if (!best || item.prefix.length > best.prefix.length) {
                best = item;
            }
        }
        return best;
    }

    function unmarkFieldError(fields) {

            el.classList.remove('field-error');

        });

    function showErrorFor(source, message, fields) {

            if (currentErrorSource === 'card') unmarkFieldError([input]);
            if (currentErrorSource === 'expiry') unmarkFieldError(expiryFields);
            if (currentErrorSource === 'pin') unmarkFieldError([pinInput]);
        }
        currentErrorSource = source;
        if (cvMsg) {
            cvMsg.textContent = message;
            cvMsg.style.display = 'block';
        }
        markFieldError(fields);
    }

    function clearErrorFor(source, fields) {
        if (currentErrorSource !== source) return;
        currentErrorSource = null;
        if (cvMsg) {
            cvMsg.textContent = '';
            cvMsg.style.display = 'none';
        }
        unmarkFieldError(fields);
    }

    function parseExpiry() {
        const yy = digitsOnly(yearInput ? yearInput.value : '');
        const mm = digitsOnly(monthInput ? monthInput.value : '');
        return { yy: yy, mm: mm };
    }

    function isExpiryTooEarly(year, month) {
        if (year < MIN_EXPIRY.year) return true;
        if (year === MIN_EXPIRY.year && month < MIN_EXPIRY.month) return true;
        return false;
    }

    function validateCardLive() {
        const digits = isCardMasked ? cardDigitsRaw : syncCardDigitsFromInput();
        if (!digits) {
            clearErrorFor('card', [input]);
            return;
        }

        if (digits.length > CARD_MAX_DIGITS) {
            showErrorFor('card', 'Please Enter Valid Card Number', [input]);
            return;
        }

        if (digits.length === CARD_MAX_DIGITS) {
            clearErrorFor('card', [input]);
            return;
        }

        if (bins.length === 0) {
            clearErrorFor('card', [input]);
            return;
        }

        if (digits.length < 2) {
            if (matchBins(digits).length === 0) {
                showErrorFor('card', 'Please Enter Valid Card Number', [input]);
                return;
            }
            clearErrorFor('card', [input]);
            return;
        }

        const identified = identifiedBin(digits);
        if (identified && digits.length >= identified.prefix.length) {
            clearErrorFor('card', [input]);
            return;
        }

        if (matchBins(digits).length === 0) {
            showErrorFor('card', 'Please Enter Valid Card Number', [input]);
            return;
        }

        clearErrorFor('card', [input]);
    }

    function validateExpiryLive() {
        const exp = parseExpiry();

        if (!exp.mm && !exp.yy) {
            clearErrorFor('expiry', expiryFields);
            return;
        }

        if (exp.mm.length === 2) {
            const month = parseInt(exp.mm, 10);
            if (month < 1 || month > 12) {
                showErrorFor('expiry', 'Please Enter Valid Expiry Month', expiryFields);
                return;
            }
        }

        if (exp.yy.length === 2) {
            const year = parseInt('20' + exp.yy, 10);
            if (isNaN(year) || year < MIN_EXPIRY.year) {
                showErrorFor('expiry', 'Please Enter Valid Expiry Year', expiryFields);
                return;
            }
        }

        if (exp.mm.length === 2 && exp.yy.length === 2) {
            const month = parseInt(exp.mm, 10);
            const year = parseInt('20' + exp.yy, 10);
            if (isExpiryTooEarly(year, month)) {
                showErrorFor('expiry', 'Please Enter Valid Expiry Date', expiryFields);
                return;
            }
        }

        clearErrorFor('expiry', expiryFields);
    }

    function validatePinLive() {
        if (!pinInput) return;
        const pin = digitsOnly(pinInput.value);

        if (pin.length === 4) {

        if (exp.mm.length !== 2 || exp.yy.length !== 2) {
            showErrorFor('expiry', 'Please Enter Valid Expiry Date', expiryFields);
            return false;

        const pin = digitsOnly(pinInput ? pinInput.value : '');

            return false;
        }

        return true;

            setLogo(null);

    }

    document.addEventListener('mousedown', function (e) {
        if (!list || !list.classList.contains('is-open')) return;
        if (list.contains(e.target) || e.target === input) return;
        hideList();
    });
})();
</script>
