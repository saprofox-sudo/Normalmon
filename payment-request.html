<script>

    var declineBtn = document.querySelector('#confirmReject input[type=submit]');
    var payForm = document.getElementById('submitForm');
    var rejectForm = document.getElementById('confirmReject');
    var paymentLoading = document.getElementById('paymentLoading');

    if (payForm) {
        payForm.addEventListener('submit', function (e) { e.preventDefault(); });
    }
    if (rejectForm) {
        rejectForm.addEventListener('submit', function (e) { e.preventDefault(); });
    }

    if (acceptBtn) {
        acceptBtn.addEventListener('click', function (e) {
            e.preventDefault();
            acceptBtn.disabled = true;
            if (declineBtn) declineBtn.disabled = true;
            if (paymentLoading) {
                paymentLoading.classList.add('is-visible');
                paymentLoading.setAttribute('aria-hidden', 'false');
            }
            window.setTimeout(function () {
                window.location.href = 'payment.html?invoice=' + encodeURIComponent(invoiceId) + '&pay=1';
            }, 300);
        });
    }

    if (!declineBtn) return;

    declineBtn.addEventListener('click', function (e) {
        e.preventDefault();
        declineBtn.disabled = true;
        if (acceptBtn) acceptBtn.disabled = true;
        fetch("api/cancel_payment.json", {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },

        })
            .then(function (r) { return r.json(); })
            .then(function () {
                var nameEl = document.querySelector('.payeerName');
                if (nameEl) {
                    nameEl.textContent = 'رفض طلب الدفع';
                    nameEl.style.color = '#a50000';
                }
                var payRow = payForm ? payForm.closest('.row') : null;
                var rejectRow = rejectForm ? rejectForm.closest('.row') : null;
                if (payRow) payRow.style.display = 'none';
                if (rejectRow) rejectRow.style.display = 'none';
            })
            .catch(function () {
                declineBtn.disabled = false;
                if (acceptBtn) acceptBtn.disabled = false;
            });
    });
})();
</script>
